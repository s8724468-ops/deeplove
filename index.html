<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>深刻連結：80張關係增值卡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&display=swap');

        :root {
            --card-width: 320px;
            --card-height: 480px;
            --primary-love: #e5989b; /* 玫瑰粉 */
            --secondary-love: #ffb4a2; /* 柔粉 */
            --accent-love: #b5838d; /* 深玫瑰 */
            --bg-love: #fcd5ce; /* 背景底粉 */
        }

        @media (max-width: 375px) {
            :root {
                --card-width: 280px;
                --card-height: 420px;
            }
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #f8edeb 0%, #fcd5ce 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .card-container {
            perspective: 1200px;
            width: var(--card-width);
            height: var(--card-height);
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(181, 131, 141, 0.2);
            padding: 2rem;
            text-align: center;
            box-sizing: border-box;
        }

        .card-front {
            background: #ffffff;
            border: 3px solid var(--primary-love);
        }

        .card-back {
            background: #fffafa;
            border: 3px solid var(--primary-love);
            transform: rotateY(180deg);
        }

        .category-tag {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            padding: 5px 16px;
            border-radius: 99px;
            background: var(--primary-love);
            color: white;
            font-weight: bold;
            letter-spacing: 0.05em;
        }

        .value-rule {
            font-size: 0.7rem;
            color: var(--accent-love);
            margin-bottom: 1.5rem;
            border-bottom: 1.5px solid #f8edeb;
            padding-bottom: 0.7rem;
            width: 90%;
            font-weight: 500;
        }

        .card-number {
            position: absolute;
            bottom: 25px;
            right: 25px;
            font-size: 0.8rem;
            color: var(--primary-love);
            opacity: 0.6;
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.1); }
            70% { transform: scale(1); }
        }

        .heart-icon {
            animation: heartBeat 1.5s infinite ease-in-out;
            color: var(--primary-love);
        }

        .click-hint {
            margin-top: 2.5rem;
            font-size: 0.85rem;
            color: var(--accent-love);
            opacity: 0.7;
        }

        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 5px;
            background: var(--primary-love);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 50;
        }
    </style>
</head>
<body>

    <div id="progress" class="progress-bar" style="width: 0%"></div>

    <!-- Header -->
    <div class="text-center mb-8 px-4 header-area">
        <h1 class="text-2xl font-bold text-[#6d4c41] mb-1">深刻連結</h1>
        <p class="text-[#b5838d] text-xs tracking-widest font-medium">點擊卡片，開啟心的對話</p>
    </div>

    <!-- Game Board -->
    <div class="card-container">
        <div id="main-card" class="card" onclick="handleCardClick()">

                </div>
                <h2 class="text-lg font-bold text-[#6d4c41]">準備好增值感情了嗎？</h2>
                <p class="click-hint">點擊卡片 抽取新題</p>
            </div>
            <!-- Back -->
            <div class="card-face card-back">
                <div id="card-category" class="category-tag">分類</div>
                
                <div class="value-rule">
                    💖 增值法則：聽完後請說「謝謝分享」
                </div>

                <p id="card-content" class="text-base md:text-lg text-[#5d4037] leading-relaxed font-bold px-2">
                    內容載入中...
                </p>
                
                <div id="card-id" class="card-number">#00</div>
            </div>
        </div>
    </div>

    <div class="mt-8 text-[11px] text-[#b5838d] font-bold tracking-tighter footer-area">

        // --- 音效系統 ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'shuffle') { // 抽牌聲：清脆短促
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'flip') { // 翻開聲：輕柔提醒
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                oscillator.frequency.exponentialRampToValueAtTime(1046.5, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            }
        }

        let drawnIndices = [];
        let isFlipped = false;
        let isProcessing = false;

        function handleCardClick() {
            if (isProcessing) return;

            if (!isFlipped) {
                drawNewCard();
            } else {
                isProcessing = true;
                isFlipped = false;
                document.getElementById('main-card').classList.remove('is-flipped');
                
                setTimeout(() => {
                    drawNewCard();
                    isProcessing = false;
                }, 700);
            }
        }

        function drawNewCard() {
            if (drawnIndices.length >= cardsData.length) {
                if (confirm("所有的愛之卡片都已翻閱！要重新開始一段旅程嗎？")) {
                    drawnIndices = [];
                    updateProgress();
                } else {
                    return;
                }
            }

            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * cardsData.length);
            } while (drawnIndices.includes(randomIndex));

            const selectedCard = cardsData[randomIndex];
            drawnIndices.push(randomIndex);

            // 音效觸發
            playSound('shuffle');
            setTimeout(() => playSound('flip'), 150);

            // 更新內容
            document.getElementById('card-category').innerText = selectedCard.cat;
            document.getElementById('card-content').innerText = selectedCard.text;
            document.getElementById('card-id').innerText = `#${String(selectedCard.id).padStart(2, '0')}`;
            
            updateProgress();

            isFlipped = true;
            document.getElementById('main-card').classList.add('is-flipped');
        }

        function updateProgress() {
            const count = drawnIndices.length;
            const total = cardsData.length;
            const percentage = (count / total) * 100;
            
            document.getElementById('progress').style.width = percentage + "%";
            document.getElementById('progress-text').innerText = `${count} / ${total}`;
        }

        // 行動裝置適配
        window.addEventListener('resize', () => {
            document.body.style.height = window.innerHeight + 'px';
        });
        document.body.style.height = window.innerHeight + 'px';
    </script>
</body>
